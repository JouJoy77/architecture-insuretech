type Query {
  """Карточка клиента по идентификатору."""
  client(id: ID!): Client
}

type Client {
  id: ID
  name: String
  age: Int

  """Документы клиента. Пустой список означает, что документов нет."""
  documents: [Document!]

  """Родственники клиента. Пустой список означает, что записей нет."""
  relatives: [Relative!]
}

type Document {
  id: ID
  type: String
  number: String
  issueDate: String
  expiryDate: String
}

type Relative {
  id: ID
  relationType: String
  name: String
  age: Int
}
